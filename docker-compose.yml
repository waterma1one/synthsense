version: "3.9"

services:
  # ── Supabase setup reminder ─────────────────────────────────────────────────
  db-setup:
    image: alpine:latest
    command: >
      sh -c "
        echo '============================================================';
        echo ' SUPABASE SETUP REQUIRED';
        echo '============================================================';
        echo ' Run this SQL in your Supabase dashboard before starting:';
        echo '';
        echo '   create extension if not exists vector;';
        echo '   -- Then run the full SQL from memory/vector_store.py';
        echo '';
        echo ' Dashboard: https://supabase.com/dashboard/project/_/sql';
        echo '============================================================';
      "
    restart: "no"

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - synthsense-data:/app/data
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── React frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  synthsense-data:
